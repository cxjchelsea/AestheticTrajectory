[project]
name = "aesthetic-trajectory-backend"
version = "0.1.0"
description = "FastAPI skeleton for the V1 aesthetic analysis workflow."
requires-python = ">=3.11"
dependencies = [
  "alembic",
  "chromadb",
  "fastapi>=0.115.0",
  "psycopg[binary]",
  "python-dotenv",
  "python-multipart",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "sqlalchemy"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]
